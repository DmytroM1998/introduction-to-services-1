spring.application.name=${SONG_SERVICE_APPLICATION_NAME:song-service}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/song-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
server.port=${SERVER_PORT:8092}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Micrometer Elasticsearch Metric Publishing
management.elastic.metrics.export.enabled=true
management.elastic.metrics.export.host=http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}
management.elastic.metrics.export.index=metrics-microservices
management.elastic.metrics.export.step=5s
management.metrics.tags.application=${spring.application.name}