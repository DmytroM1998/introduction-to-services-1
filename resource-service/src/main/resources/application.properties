spring.application.name=${RESOURCE_SERVICE_APPLICATION_NAME:resource-service}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
server.port=${SERVER_PORT:8091}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}


# song-service
song.service.ref.name=${SONG_SERVICE_REF_NAME:song-service}

# S3 client configuration
resource.storage.endpoint=${RESOURCE_STORAGE_ENDPOINT:http://localhost:4566}
resource.storage.region=${AWS_REGION:us-east-1}
resource.storage.access-key=${AWS_ACCESS_KEY_ID:test}
resource.storage.secret-key=${AWS_SECRET_ACCESS_KEY:test}

# storage
storage.service.ref.name=${STORAGE_SERVICE_REF_NAME:storage}
storage.service.url=${STORAGE_SERVICE_URL:http://localhost:8086}
storage.fallback.staging.bucket=${STAGING_STORAGE_BUCKET:resources-staging}
storage.fallback.permanent.bucket=${PERMANENT_STORAGE_BUCKET:resources-permanent}
storage.fallback.staging.path=${STAGING_STORAGE_PATH:resources/staging/}
storage.fallback.permanent.path=${PERMANENT_STORAGE_PATH:resources/permanent/}

# RabbitMQ resource processed event
resource.processed.exchange=${RESOURCE_PROCESSED_EXCHANGE:resource.processed}
resource.processed.queue=${RESOURCE_PROCESSED_QUEUE:resource.processed}
resource.processed.routing-key=${RESOURCE_PROCESSED_ROUTING_KEY:resource.processed}

# Circuit Breaker
resilience4j.circuitbreaker.instances.storage-service.sliding-window-size=${STORAGE_CIRCUIT_BREAKER_WINDOW_SIZE:1}
resilience4j.circuitbreaker.instances.storage-service.minimum-number-of-calls=${STORAGE_CIRCUIT_BREAKER_MINIMUM_CALLS:1}
resilience4j.circuitbreaker.instances.storage-service.failure-rate-threshold=${STORAGE_CIRCUIT_BREAKER_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.storage-service.wait-duration-in-open-state=${STORAGE_CIRCUIT_BREAKER_OPEN_DURATION:10s}
resilience4j.circuitbreaker.instances.storage-service.permitted-number-of-calls-in-half-open-state=${STORAGE_CIRCUIT_BREAKER_HALF_OPEN_CALLS:2}