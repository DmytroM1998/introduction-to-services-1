spring.application.name=${RESOURCE_SERVICE_APPLICATION_NAME:resource-service}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
server.port=${SERVER_PORT:8091}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}


# song-service
song.service.ref.name=${SONG_SERVICE_REF_NAME:song-service}

# LocalStack (S3 emulator)
resource.storage.bucket=${RESOURCE_STORAGE_BUCKET:resources}
resource.storage.endpoint=${RESOURCE_STORAGE_ENDPOINT:http://localhost:4566}
resource.storage.region=${AWS_REGION:us-east-1}
resource.storage.access-key=${AWS_ACCESS_KEY_ID:test}
resource.storage.secret-key=${AWS_SECRET_ACCESS_KEY:test}