spring.application.name=${STORAGE_SERVICE_REF_NAME:storage}
server.port=${STORAGE_SERVER_PORT:8086}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/storage-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}

storage.bootstrap.staging.bucket=${STAGING_STORAGE_BUCKET:resources-staging}
storage.bootstrap.permanent.bucket=${PERMANENT_STORAGE_BUCKET:resources-permanent}
storage.bootstrap.staging.path=${STAGING_STORAGE_PATH:resources/staging/}
storage.bootstrap.permanent.path=${PERMANENT_STORAGE_PATH:resources/permanent/}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}

# Spring Actuator
management.endpoints.web.exposure.include=health
