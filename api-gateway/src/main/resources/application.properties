spring.application.name=${API_GATEWAY_SERVER_APPLICATION_NAME:api-gateway}
server.port=${API_GATEWAY_SERVER_PORT:8110}

# Routes: destinations are resolved by Eureka service names via the "lb://" scheme
# Resource Service: /resources, /resources/**
spring.cloud.gateway.server.webmvc.routes[0].id=${RESOURCE_SERVICE_REF_NAME:resource-service}
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://${RESOURCE_SERVICE_REF_NAME:resource-service}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/resources,/resources/**
# Song Service: /songs, /songs/**
spring.cloud.gateway.server.webmvc.routes[1].id=${SONG_SERVICE_REF_NAME:song-service}
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://${SONG_SERVICE_REF_NAME:song-service}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/songs,/songs/**
# Service-prefixed access to any other endpoint, e.g. /resource-service/health -> resource-service /health
spring.cloud.gateway.server.webmvc.routes[2].id=${RESOURCE_SERVICE_REF_NAME:resource-service}-prefixed
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://${RESOURCE_SERVICE_REF_NAME:resource-service}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/${RESOURCE_SERVICE_REF_NAME:resource-service}/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1
spring.cloud.gateway.server.webmvc.routes[3].id=${SONG_SERVICE_REF_NAME:song-service}-prefixed
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://${SONG_SERVICE_REF_NAME:song-service}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/${SONG_SERVICE_REF_NAME:song-service}/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1

# Actuator (used by the Docker health check)
management.endpoints.web.exposure.include=health

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
# Frequency of heartbeats sent by the client to the server
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
# Frequency of registry data retrieval from the server to the client's local cache
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}
