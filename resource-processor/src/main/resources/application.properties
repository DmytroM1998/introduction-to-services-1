spring.application.name=resource-processor
server.port=${SERVER_PORT:8101}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# Service discovery
resource.service.ref.name=${RESOURCE_SERVICE_REF_NAME:resource-service}
song.service.ref.name=${SONG_SERVICE_REF_NAME:song-service}

# Spring Cloud Stream
spring.cloud.function.definition=resourceMessageListener
spring.cloud.stream.bindings.resourceMessageListener-in-0.destination=${RESOURCE_RABBITMQ_EXCHANGE:resource.uploaded}
spring.cloud.stream.bindings.resourceMessageListener-in-0.group=resource-processor
