spring.application.name=${RESOURCE_PROCESSOR_APPLICATION_NAME:resource-processor}
spring.main.web-application-type=${RESOURCE_PROCESSOR_WEB_APPLICATION_TYPE:none}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY:true}
eureka.instance.lease-renewal-interval-in-seconds=${EUREKA_LEASE_RENEWAL_INTERVAL_IN_SECONDS:5}
eureka.client.registry-fetch-interval-seconds=${EUREKA_REGISTRY_FETCH_INTERVAL_IN_SECONDS:5}

# Service discovery
resource.service.ref.name=${RESOURCE_SERVICE_REF_NAME:resource-service}
song.service.ref.name=${SONG_SERVICE_REF_NAME:song-service}

# Spring Cloud Stream
spring.cloud.function.definition=${RESOURCE_PROCESSOR_FUNCTION_DEFINITION:resourceMessageListener}
spring.cloud.stream.bindings.resourceMessageListener-in-0.destination=${RESOURCE_RABBITMQ_EXCHANGE:resource.uploaded}
spring.cloud.stream.bindings.resourceMessageListener-in-0.group=${RESOURCE_PROCESSOR_STREAM_GROUP:resource-processor}
