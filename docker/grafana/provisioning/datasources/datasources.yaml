apiVersion: 1

datasources:
  - name: Elasticsearch-Logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: "microservices-logs-*"
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "severity"
    isDefault: true
    editable: true

  - name: Elasticsearch-Metrics
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: "metrics-microservices-*"
      timeField: "@timestamp"
    editable: true