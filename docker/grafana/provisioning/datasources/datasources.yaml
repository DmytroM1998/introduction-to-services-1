apiVersion: 1

datasources:
  - name: Elasticsearch-Logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "logs-microservices-*"
    jsonData:
      timeField: "@timestamp"
      logMessageField: "message"
      logLevelField: "level"
    isDefault: true
    editable: true

  - name: Elasticsearch-Metrics
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "metrics-microservices-*"
    jsonData:
      timeField: "@timestamp"
    editable: true