spring.application.name=${EUREKA_SERVER_APPLICATION_NAME:eureka-server}

server.port=${SERVER_PORT:8761}
# "Avoid hardcoding values in application.properties". Well...
eureka.client.register-with-eureka=${EUREKA_SERVER_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_SERVER_FETCH_REGISTRY:false}
logging.level.com.netflix.eureka=${EUREKA_SERVER_LOG_LEVEL:OFF}
logging.level.com.netflix.discovery=${EUREKA_DISCOVERY_LOG_LEVEL:OFF}
